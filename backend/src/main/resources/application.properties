# Application
spring.application.name=slotmind-backend

# HTTP server - accessible locally and from other devices on the network
server.address=0.0.0.0
server.port=8080
server.servlet.context-path=/slotmind

# MySQL database
spring.datasource.url=jdbc:mysql://localhost:3306/ai_rescheduling?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD:Zycus@123}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# JPA / Hibernate
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.jdbc.time_zone=UTC
spring.jpa.database-platform=org.hibernate.dialect.MySQLDialect

# Hikari connection pool
spring.datasource.hikari.maximum-pool-size=10
spring.datasource.hikari.minimum-idle=2
spring.datasource.hikari.connection-timeout=30000
spring.datasource.hikari.validation-timeout=5000

# Do not automatically execute the reset schema-and-seed script on startup.
# Run src/main/resources/db/slotmind_schema_seed.sql manually when required.
spring.sql.init.mode=never

# Scheduling strategy: rule or ai
slotmind.scheduling.strategy=${SCHEDULING_STRATEGY:rule}

# Separate Python AI gateway
slotmind.ai.gateway-url=${AI_GATEWAY_URL:http://localhost:8001}

# Actuator health endpoint for startup checks
management.endpoints.web.exposure.include=health,info
management.endpoint.health.show-details=always

# JSON and request handling
spring.jackson.serialization.write-dates-as-timestamps=false
spring.mvc.async.request-timeout=30000